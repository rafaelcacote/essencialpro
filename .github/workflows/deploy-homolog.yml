name: Deploy Homolog

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-homolog
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Hostinger (homolog)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install & build frontend assets
        run: |
          npm ci
          npm run build
          tar -czf /tmp/vite-build.tar.gz -C public build

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          cat > ~/.ssh/config << EOF
          Host hostinger
          HostName ${{ secrets.HOSTINGER_HOST }}
          User ${{ secrets.HOSTINGER_USER }}
          Port ${{ secrets.HOSTINGER_PORT }}
          IdentityFile ~/.ssh/hostinger_deploy
          IdentitiesOnly yes
          StrictHostKeyChecking accept-new
          ConnectTimeout 60
          ConnectionAttempts 3
          ServerAliveInterval 15
          ServerAliveCountMax 4
          EOF
          # Remove indentação acidental do YAML
          sed -i 's/^[[:space:]]*//' ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy via SSH (with retries)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 5
          retry_wait_seconds: 45
          warning_on_retry: true
          command: |
            set -euo pipefail

            echo "==> Testar SSH"
            ssh hostinger 'echo SSH_OK && hostname'

            echo "==> Enviar assets Vite"
            scp /tmp/vite-build.tar.gz hostinger:~/domains/essencialprotection.com/apps/homolog/vite-build.tar.gz

            echo "==> Atualizar aplicação"
            ssh hostinger 'bash -s' << 'REMOTE'
            set -euo pipefail
            APP_DIR="$HOME/domains/essencialprotection.com/apps/homolog"
            BRANCH="develop"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERRO: $APP_DIR não existe. Faz o clone inicial no servidor primeiro."
              exit 1
            fi

            cd "$APP_DIR"
            php artisan down --retry=60 || true

            git fetch origin
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            # --no-scripts: Composer no Hostinger usa proc_open nos scripts e falha.
            composer install --no-dev --optimize-autoloader --no-interaction --no-scripts
            php artisan package:discover --ansi
            php artisan migrate --force
            php artisan storage:link 2>/dev/null || true

            if [ -f vite-build.tar.gz ]; then
              rm -rf public/build
              tar -xzf vite-build.tar.gz -C public
              rm -f vite-build.tar.gz
            fi

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan up

            echo "Deploy homolog concluído."
            REMOTE
